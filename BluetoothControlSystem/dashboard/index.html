<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bluetooth Control System - Full Operations Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --secondary: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-dark: #1f2937;
            --bg-darker: #111827;
            --bg-light: #374151;
            --text-light: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #4b5563;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-darker);
            color: var(--text-light);
            overflow-x: hidden;
        }

        .container {
            max-width: 1920px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        header {
            background: var(--bg-dark);
            padding: 20px 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        header h1 {
            font-size: 2em;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--secondary);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .header-stats {
            display: flex;
            gap: 30px;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: var(--primary);
        }

        .stat-label {
            font-size: 0.9em;
            color: var(--text-muted);
        }

        /* Grid Layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .panel {
            background: var(--bg-dark);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border);
        }

        .panel-title {
            font-size: 1.3em;
            font-weight: 600;
        }

        .panel-actions {
            display: flex;
            gap: 10px;
        }

        /* Buttons */
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--secondary);
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 0.85em;
        }

        /* Device List */
        .device-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 500px;
            overflow-y: auto;
        }

        .device-card {
            background: var(--bg-light);
            border-radius: 10px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .device-card:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }

        .device-info {
            flex: 1;
        }

        .device-name {
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .device-details {
            display: flex;
            gap: 15px;
            font-size: 0.85em;
            color: var(--text-muted);
        }

        .device-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 0.8em;
            font-weight: 600;
        }

        .badge-connected {
            background: var(--secondary);
            color: white;
        }

        .badge-disconnected {
            background: var(--danger);
            color: white;
        }

        .badge-audio {
            background: #8b5cf6;
            color: white;
        }

        .badge-light {
            background: #f59e0b;
            color: white;
        }

        .signal-strength {
            display: flex;
            gap: 3px;
            align-items: flex-end;
        }

        .signal-bar {
            width: 4px;
            background: var(--text-muted);
            border-radius: 2px;
        }

        .signal-bar.active {
            background: var(--secondary);
        }

        /* Controls */
        .control-group {
            margin-bottom: 20px;
        }

        .control-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .slider {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: var(--bg-light);
            outline: none;
            -webkit-appearance: none;
            margin-bottom: 5px;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
        }

        .slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
        }

        .slider-value {
            text-align: right;
            color: var(--text-muted);
            font-size: 0.9em;
        }

        /* Scenes */
        .scenes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }

        .scene-card {
            background: var(--bg-light);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .scene-card:hover {
            background: var(--primary);
            transform: scale(1.05);
        }

        .scene-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .scene-name {
            font-weight: 600;
        }

        /* Automation Rules */
        .rule-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .rule-item {
            background: var(--bg-light);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .rule-info h4 {
            margin-bottom: 5px;
        }

        .rule-trigger {
            font-size: 0.9em;
            color: var(--text-muted);
        }

        .toggle-switch {
            position: relative;
            width: 50px;
            height: 26px;
            background: var(--bg-darker);
            border-radius: 15px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .toggle-switch.active {
            background: var(--secondary);
        }

        .toggle-slider {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .toggle-switch.active .toggle-slider {
            transform: translateX(24px);
        }

        /* Logs */
        .log-container {
            background: var(--bg-darker);
            border-radius: 8px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }

        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid var(--border);
        }

        .log-time {
            color: var(--text-muted);
            margin-right: 10px;
        }

        .log-info { color: var(--secondary); }
        .log-warning { color: var(--warning); }
        .log-error { color: var(--danger); }

        /* Charts */
        .chart-container {
            width: 100%;
            height: 250px;
            background: var(--bg-darker);
            border-radius: 8px;
            padding: 15px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-dark);
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border);
        }

        .close-btn {
            font-size: 2em;
            cursor: pointer;
            color: var(--text-muted);
        }

        .close-btn:hover {
            color: var(--danger);
        }

        /* Transitions Panel */
        .transition-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .transition-item {
            background: var(--bg-light);
            border-radius: 8px;
            padding: 15px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--bg-darker);
            border-radius: 5px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 5px;
            transition: width 0.1s linear;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .header-stats {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>
                <span class="status-indicator"></span>
                Bluetooth Control System
            </h1>
            <div class="header-stats">
                <div class="stat">
                    <div class="stat-value" id="deviceCount">0</div>
                    <div class="stat-label">Devices</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="connectedCount">0</div>
                    <div class="stat-label">Connected</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="activeTransitions">0</div>
                    <div class="stat-label">Transitions</div>
                </div>
            </div>
        </header>

        <!-- Main Dashboard Grid -->
        <div class="dashboard-grid">
            <!-- Devices Panel -->
            <div class="panel">
                <div class="panel-header">
                    <h2 class="panel-title">🔵 Devices</h2>
                    <div class="panel-actions">
                        <button class="btn btn-primary btn-sm" onclick="scanDevices()">Scan</button>
                    </div>
                </div>
                <div class="device-list" id="deviceList">
                    <!-- Devices will be populated here -->
                </div>
            </div>

            <!-- Device Control Panel -->
            <div class="panel">
                <div class="panel-header">
                    <h2 class="panel-title">🎛️ Control</h2>
                </div>
                <div id="deviceControl">
                    <p style="color: var(--text-muted); text-align: center;">Select a device to control</p>
                </div>
            </div>

            <!-- Scenes Panel -->
            <div class="panel">
                <div class="panel-header">
                    <h2 class="panel-title">🎭 Scenes</h2>
                    <div class="panel-actions">
                        <button class="btn btn-secondary btn-sm" onclick="createScene()">New Scene</button>
                    </div>
                </div>
                <div class="scenes-grid" id="scenesList">
                    <!-- Scenes will be populated here -->
                </div>
            </div>

            <!-- Automation Panel -->
            <div class="panel">
                <div class="panel-header">
                    <h2 class="panel-title">⚙️ Automation</h2>
                    <div class="panel-actions">
                        <button class="btn btn-secondary btn-sm" onclick="createRule()">New Rule</button>
                    </div>
                </div>
                <div class="rule-list" id="rulesList">
                    <!-- Rules will be populated here -->
                </div>
            </div>

            <!-- Active Transitions -->
            <div class="panel">
                <div class="panel-header">
                    <h2 class="panel-title">⏱️ Active Transitions</h2>
                </div>
                <div class="transition-list" id="transitionsList">
                    <p style="color: var(--text-muted); text-align: center;">No active transitions</p>
                </div>
            </div>

            <!-- System Logs -->
            <div class="panel">
                <div class="panel-header">
                    <h2 class="panel-title">📋 System Logs</h2>
                    <div class="panel-actions">
                        <button class="btn btn-sm" onclick="clearLogs()">Clear</button>
                    </div>
                </div>
                <div class="log-container" id="logContainer">
                    <!-- Logs will be populated here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Device Control Modal -->
    <div class="modal" id="deviceModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalDeviceName">Device Control</h2>
                <span class="close-btn" onclick="closeModal()">&times;</span>
            </div>
            <div id="modalContent">
                <!-- Dynamic content -->
            </div>
        </div>
    </div>

    <script>
        // WebSocket connection
        let ws = null;
        let selectedDevice = null;

        // State
        const state = {
            devices: [],
            scenes: [],
            rules: [],
            transitions: [],
            logs: []
        };

        // Initialize
        function init() {
            connectWebSocket();
            loadInitialData();
        }

        // WebSocket
        function connectWebSocket() {
            ws = new WebSocket('ws://localhost:8081');

            ws.onopen = () => {
                log('Connected to Bluetooth Control System', 'info');
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleWebSocketMessage(data);
            };

            ws.onclose = () => {
                log('Disconnected from server', 'warning');
                setTimeout(connectWebSocket, 5000);
            };

            ws.onerror = (error) => {
                log('WebSocket error', 'error');
            };
        }

        function handleWebSocketMessage(data) {
            switch (data.type) {
                case 'devices_update':
                    state.devices = data.devices;
                    updateDeviceList();
                    break;
                case 'device_connected':
                    log(`Connected to ${data.device.name}`, 'info');
                    break;
                case 'device_disconnected':
                    log(`Disconnected from ${data.device.name}`, 'warning');
                    break;
                case 'transition_update':
                    updateTransitions(data.transitions);
                    break;
                case 'scene_activated':
                    log(`Scene activated: ${data.scene.name}`, 'info');
                    break;
                case 'rule_triggered':
                    log(`Rule triggered: ${data.rule.name}`, 'info');
                    break;
            }
        }

        // Load data
        async function loadInitialData() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();

                state.devices = data.devices || [];
                state.scenes = data.scenes || [];
                state.rules = data.rules || [];

                updateDeviceList();
                updateScenes();
                updateRules();
                updateStats();
            } catch (error) {
                log('Failed to load initial data', 'error');
            }
        }

        // Device List
        function updateDeviceList() {
            const container = document.getElementById('deviceList');
            if (state.devices.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); text-align: center;">No devices found</p>';
                return;
            }

            container.innerHTML = state.devices.map(device => `
                <div class="device-card" onclick="selectDevice('${device.address}')">
                    <div class="device-info">
                        <div class="device-name">${device.name || 'Unknown Device'}</div>
                        <div class="device-details">
                            <span class="device-badge badge-${device.state}">${device.state}</span>
                            <span class="device-badge badge-${device.device_type}">${device.device_type}</span>
                            <span>${device.address}</span>
                            <span>RSSI: ${device.rssi} dBm</span>
                            ${device.battery_level ? `<span>🔋 ${device.battery_level}%</span>` : ''}
                        </div>
                    </div>
                    <div class="signal-strength">
                        ${getSignalBars(device.rssi)}
                    </div>
                </div>
            `).join('');

            updateStats();
        }

        function getSignalBars(rssi) {
            const strength = Math.min(Math.max((rssi + 100) / 50, 0), 1);
            const bars = Math.ceil(strength * 5);
            return Array.from({length: 5}, (_, i) =>
                `<div class="signal-bar ${i < bars ? 'active' : ''}" style="height: ${(i + 1) * 4}px"></div>`
            ).join('');
        }

        // Select Device
        function selectDevice(address) {
            selectedDevice = state.devices.find(d => d.address === address);
            if (!selectedDevice) return;

            const control = document.getElementById('deviceControl');
            control.innerHTML = `
                <h3>${selectedDevice.name}</h3>
                <div class="control-group">
                    <label class="control-label">Volume</label>
                    <input type="range" class="slider" min="0" max="100" value="${selectedDevice.metadata?.volume || 50}"
                           onchange="setProperty('${address}', 'volume', this.value)">
                    <div class="slider-value">${selectedDevice.metadata?.volume || 50}%</div>
                </div>
                <div class="control-group">
                    <label class="control-label">Brightness</label>
                    <input type="range" class="slider" min="0" max="100" value="${selectedDevice.metadata?.brightness || 100}"
                           onchange="setProperty('${address}', 'brightness', this.value)">
                    <div class="slider-value">${selectedDevice.metadata?.brightness || 100}%</div>
                </div>
                <div class="control-group">
                    <button class="btn btn-primary" onclick="transitionFadeIn('${address}')">Fade In</button>
                    <button class="btn btn-danger" onclick="transitionFadeOut('${address}')">Fade Out</button>
                    ${selectedDevice.state === 'connected' ?
                        `<button class="btn btn-danger" onclick="disconnect('${address}')">Disconnect</button>` :
                        `<button class="btn btn-secondary" onclick="connect('${address}')">Connect</button>`
                    }
                </div>
            `;
        }

        // Control Functions
        async function setProperty(address, property, value) {
            try {
                await fetch('/api/set_property', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({address, property, value: parseFloat(value)})
                });
            } catch (error) {
                log(`Failed to set ${property}`, 'error');
            }
        }

        async function transitionFadeIn(address) {
            try {
                await fetch('/api/transition', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        address,
                        property: 'volume',
                        to_value: 100,
                        duration: 3.0,
                        easing: 'ease-in'
                    })
                });
                log('Fade in started', 'info');
            } catch (error) {
                log('Transition failed', 'error');
            }
        }

        async function transitionFadeOut(address) {
            try {
                await fetch('/api/transition', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        address,
                        property: 'volume',
                        to_value: 0,
                        duration: 2.0,
                        easing: 'ease-out'
                    })
                });
                log('Fade out started', 'info');
            } catch (error) {
                log('Transition failed', 'error');
            }
        }

        async function connect(address) {
            try {
                await fetch('/api/connect', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({address})
                });
            } catch (error) {
                log('Connection failed', 'error');
            }
        }

        async function disconnect(address) {
            try {
                await fetch('/api/disconnect', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({address})
                });
            } catch (error) {
                log('Disconnect failed', 'error');
            }
        }

        async function scanDevices() {
            log('Scanning for devices...', 'info');
            try {
                await fetch('/api/scan', {method: 'POST'});
            } catch (error) {
                log('Scan failed', 'error');
            }
        }

        // Scenes
        function updateScenes() {
            const container = document.getElementById('scenesList');
            if (state.scenes.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); text-align: center;">No scenes created</p>';
                return;
            }

            container.innerHTML = state.scenes.map(scene => `
                <div class="scene-card" onclick="activateScene('${scene.id}')">
                    <div class="scene-icon">${scene.icon || '🎬'}</div>
                    <div class="scene-name">${scene.name}</div>
                </div>
            `).join('');
        }

        async function activateScene(sceneId) {
            try {
                await fetch('/api/activate_scene', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({scene_id: sceneId})
                });
            } catch (error) {
                log('Scene activation failed', 'error');
            }
        }

        // Automation
        function updateRules() {
            const container = document.getElementById('rulesList');
            if (state.rules.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); text-align: center;">No automation rules</p>';
                return;
            }

            container.innerHTML = state.rules.map(rule => `
                <div class="rule-item">
                    <div class="rule-info">
                        <h4>${rule.name}</h4>
                        <div class="rule-trigger">${rule.trigger_type}: ${rule.trigger_value}</div>
                    </div>
                    <div class="toggle-switch ${rule.enabled ? 'active' : ''}"
                         onclick="toggleRule('${rule.id}')">
                        <div class="toggle-slider"></div>
                    </div>
                </div>
            `).join('');
        }

        async function toggleRule(ruleId) {
            try {
                await fetch('/api/toggle_rule', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({rule_id: ruleId})
                });
            } catch (error) {
                log('Failed to toggle rule', 'error');
            }
        }

        // Transitions
        function updateTransitions(transitions) {
            state.transitions = transitions;
            const container = document.getElementById('transitionsList');

            if (transitions.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); text-align: center;">No active transitions</p>';
                document.getElementById('activeTransitions').textContent = '0';
                return;
            }

            container.innerHTML = transitions.map(t => `
                <div class="transition-item">
                    <div>${t.property_name}: ${t.from_value} → ${t.to_value}</div>
                    <small style="color: var(--text-muted);">${t.device_address}</small>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${t.progress * 100}%"></div>
                    </div>
                </div>
            `).join('');

            document.getElementById('activeTransitions').textContent = transitions.length;
        }

        // Logging
        function log(message, level = 'info') {
            const now = new Date().toLocaleTimeString();
            state.logs.unshift({time: now, message, level});
            if (state.logs.length > 100) state.logs.pop();

            const container = document.getElementById('logContainer');
            container.innerHTML = state.logs.map(log => `
                <div class="log-entry log-${log.level}">
                    <span class="log-time">[${log.time}]</span>
                    ${log.message}
                </div>
            `).join('');
        }

        function clearLogs() {
            state.logs = [];
            document.getElementById('logContainer').innerHTML = '';
        }

        // Stats
        function updateStats() {
            document.getElementById('deviceCount').textContent = state.devices.length;
            document.getElementById('connectedCount').textContent =
                state.devices.filter(d => d.state === 'connected').length;
        }

        // Modal
        function closeModal() {
            document.getElementById('deviceModal').classList.remove('active');
        }

        function createScene() {
            alert('Scene creation UI coming soon!');
        }

        function createRule() {
            alert('Rule creation UI coming soon!');
        }

        // Initialize on load
        window.onload = init;
    </script>
</body>
</html>
