version: '3.8'

services:
  # PostgreSQL Database for Explorer
  postgres:
    image: postgres:16-alpine
    container_name: presencechain-postgres
    environment:
      POSTGRES_DB: presencechain
      POSTGRES_USER: presencechain
      POSTGRES_PASSWORD: presencechain
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - presencechain

  # PresenceChain Core Node
  core:
    build:
      context: ./packages/core
      dockerfile: Dockerfile
    container_name: presencechain-core
    ports:
      - "8545:8545"  # JSON-RPC
      - "30303:30303"  # P2P
    volumes:
      - core-data:/app/data
    networks:
      - presencechain
    command: ["--rpc-port", "8545", "--p2p-port", "30303", "--data-dir", "/app/data"]

  # Explorer API (Indexer)
  explorer-api:
    build:
      context: ./packages/explorer-api
      dockerfile: Dockerfile
    container_name: presencechain-explorer-api
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      RPC_URL: http://core:8545
      DATABASE_URL: postgresql://presencechain:presencechain@postgres:5432/presencechain
    depends_on:
      - postgres
      - core
    networks:
      - presencechain

  # Dashboard (Wallet UI)
  dashboard:
    build:
      context: ./packages/dashboard
      dockerfile: Dockerfile
    container_name: presencechain-dashboard
    ports:
      - "3000:3000"
    environment:
      VITE_RPC_URL: http://localhost:8545
    networks:
      - presencechain

  # Explorer Web (Block Explorer)
  explorer-web:
    build:
      context: ./packages/explorer-web
      dockerfile: Dockerfile
    container_name: presencechain-explorer-web
    ports:
      - "3001:3000"
    environment:
      VITE_API_URL: http://localhost:4000/api
    networks:
      - presencechain

networks:
  presencechain:
    driver: bridge

volumes:
  postgres-data:
  core-data:
